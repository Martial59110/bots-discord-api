version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: bots-nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app-prod
      - front-prod
    networks:
      - app-network

  app-prod:
    container_name: bots-api-prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - .env.production
    volumes:
      - app_logs:/app/logs
    depends_on:
      - db
    networks:
      - app-network

  front-prod:
    container_name: bots-front-prod
    build:
      context: ../front-bot
      dockerfile: Dockerfile.prod
    env_file:
      - ../front-bot/.env.production
    volumes:
      - ../front-bot:/app
      - /app/node_modules
    depends_on:
      - app-prod
    networks:
      - app-network

  db: 
    image: postgres:17-alpine
    container_name: bots-api-db-prod
    env_file:
      - .env.db
    volumes: 
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  app_logs:
